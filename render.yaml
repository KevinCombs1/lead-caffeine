# Render Blueprint — Lead Caffeine Geofencing Platform
# Docs: https://render.com/docs/blueprint-spec
#
# After pushing to GitHub, go to:
# https://dashboard.render.com/blueprints → New Blueprint → connect repo
# Render creates all services defined below automatically.
#
# After deploy: open a shell on the lead-caffeine web service and run:
#   ./scripts/init-production.sh

services:
  # ── Web Service (Node.js app) ──────────────────────────────────────────
  - type: web
    name: lead-caffeine
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: SCANNER_PASSWORD
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: redis://lead-caffeine-redis:6379
      - key: CLICKHOUSE_URL
        value: http://lead-caffeine-clickhouse:8123
      - key: CLICKHOUSE_USER
        value: default
      - key: CLICKHOUSE_PASSWORD
        sync: false
      - key: BIDDER_DOMAIN
        value: https://leadcaffeine.com
      - key: SESSION_SECRET
        generateValue: true
      - key: FLARESOLVERR_URL
        value: http://lead-caffeine-flaresolverr:8191

  # ── PostgreSQL + PostGIS (private service) ──────────────────────────────
  - type: pserv
    name: lead-caffeine-db
    runtime: image
    image:
      url: docker.io/postgis/postgis:16-3.6
    plan: starter
    envVars:
      - key: POSTGRES_USER
        value: leadcaffeine
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        value: leadcaffeine
    disk:
      name: pg-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 10

  # ── Redis (private service) ────────────────────────────────────────────
  - type: pserv
    name: lead-caffeine-redis
    runtime: image
    image:
      url: docker.io/redis:7-alpine
    plan: starter
    envVars:
      - key: REDIS_URL
        value: redis://lead-caffeine-redis:6379

  # ClickHouse is deployed manually as an image-backed service (not via blueprint)
  # because Render's blueprint sync overwrites image-backed services with Git-backed
  # configs when the render.yaml lives in a repo.
  # Create it manually: + New → Private Service → Existing Image →
  # docker.io/clickhouse/clickhouse-server:latest
  # Env vars: CLICKHOUSE_RUN_AS_ROOT=1, CLICKHOUSE_USER=default,
  # CLICKHOUSE_PASSWORD=<your-password>, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
  # Disk: /var/lib/clickhouse, 10GB

  # ── FlareSolverr (private service) ──────────────────────────────────────
  - type: pserv
    name: lead-caffeine-flaresolverr
    runtime: image
    image:
      url: ghcr.io/flaresolverr/flaresolverr:latest
    plan: starter
